<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на приём</title>
    <link rel="icon" href="./icon/main_icon.png">
</head>

<body>
    <header>
        <h1>Запись на приём</h1>
    </header>
    <main>
        <form action="#" method="get">
            <fieldset>
                <legend>Данные</legend>

                <p>
                    <label for="full-name">Фамилия, имя и отчество: </label><br>
                    <input id="full-name" name="full-name" type="text" required minlength="3"
                        pattern="[А-Яа-яЁёA-Za-z]+([ -][А-Яа-яЁёA-Za-z]+){1,2}"
                        title="Введите имя и фамилию, используя только буквы, пробел или дефис." autocomplete="name">
                </p>
                <p>
                    <label for="city">Город: </label><br>
                    <input id="city" name="city" type="text" list="cities" required autocomplete="address-level2">
                    <datalist id="cities">
                        <option value="Москва">
                        <option value="Санкт-Петербург">
                    </datalist>
                </p>

                <p>
                    <label for="email">Электронная почта: </label><br>
                    <input id="email" name="email" type="email" required autocomplete="email">
                </p>

                <p>
                    <label for="phone">Телефон: </label><br>
                    <input id="phone" name="phone" type="tel" required title="Введите номер в формате +79991234567."
                        placeholder="+79991234567" autocomplete="tel">
                </p>
            </fieldset>
            <fieldset>
                <legend>Информация о приеме:</legend>
                <p>
                    <label for="visit-date">Дата: </label><br>
                    <input id="visit-date" name="visit-date" type="date" required min="2026-09-12" max="2027-12-31">
                </p>

                <p>
                    <label for="guests">Число посетителей: </label><br>
                    <input id="guests" name="guests" type="number" required min="1" max="6" step="1" value="1">
                </p>
                <p>Выберите тип приема:</p>
                <p>
                    <input id="consultation" name="service" type="radio" value="consultation" required>
                    <label for="consultation">Первичная консультация</label><br>

                    <input id="repeat-visit" name="service" type="radio" value="repeat-visit">
                    <label for="repeat-visit">Повторный приём</label><br>

                </p>
            </fieldset>
            <fieldset>
                <legend>Дополнительные условия</legend>

                <p>
                    <input id="sms" name="sms" type="checkbox" value="yes">
                    <label for="sms">Прислать напоминание о записи</label>
                </p>

                <p>
                    <input id="consent" name="consent" type="checkbox" value="yes" required>
                    <label for="consent">Я согласен на обработку персональных данных </label>
                </p>
            </fieldset>
            <p>
                <input type="submit" value="Записаться">
                <input type="reset" value="Очистить форму">
            </p>
        </form>
    </main>
    <footer>
        <h2>Контакты</h2>
        <ul>
            <li><b>Email:</b> <a href="mailto:example@email.com">example@email.com</a></li>
            <li><b>Телефон:</b> +7 (123) 456-78-90</li> 
        </ul>
        <a href="https://www.flaticon.com/ru/free-icons/" title="портфолио иконки">Портфолио иконки от srip -
            Flaticon</a>
    </footer>
</body>

</html>
