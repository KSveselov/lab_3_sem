<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товароы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img class="icon" src="favicon.svg" alt="" width="32" height="32">
        <h1>Market</h1>
    </header>
    <main>
        <div class="search">
            <input type="text" placeholder="Поиск по каталогу">
            <button class="search-button" type="submit">🔍</button>
        </div>
        <div class="catalog-layout">
            <aside class="filters">
                <h2 id="filters-title">Фильтры</h2>
                <fieldset>
                    <legend>Категория</legend>
                    <label><input type="checkbox" name="category" value="electronics"> Электроника</label>
                    <label><input type="checkbox" name="category" value="clothing"> Одежда и аксессуары</label>
                </fieldset>
                <fieldset>
                    <legend>Цена, руб.</legend>
                    <label for="price-min">От</label>
                    <input id="price-min" type="number" name="price-min" min="0" placeholder="0">
                    <label for="price-max">До</label>
                    <input id="price-max" type="number" name="price-max" min="0" placeholder="60 000">
                </fieldset>
                <fieldset>
                    <legend>Наличие</legend>
                    <label><input type="checkbox" name="in-stock"> В наличии</label>
                </fieldset>
            </aside>
            <div class="catalog">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7462.952617161382!2d34.39505071542811!3d61.78919720339159!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x46a1ec67e7f9bee3%3A0x402fe650062edc62!2z0JzRg9C30LXQuSDQuNC30L7QsdGA0LDQt9C40YLQtdC70YzQvdGL0YUg0LjRgdC60YPRgdGB0YLQsg!5e0!3m2!1sru!2sru!4v1792407458626!5m2!1sru!2sru"  style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <h2>Market</h2>
                <p>© 2026 Все права защищены.</p>
            </div>

            <div>
                <h2>Покупателям</h2>
                <ul>
                    <li><a href="">Доставка и оплата</a></li>
                    <li><a href="">Возврат товара</a></li>
                </ul>
            </div>

            <div>
                <h2>Контакты</h2>
                <a href="mailto:shop@example.com">shop@example.com</a>
            </div>
        </div>
    </footer>
</body>

</html>
